[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "affinity-profile-information"
version = "1.0.0"
description = "Replay and fit interval-regression analyses of cached affinity-score panels"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = {file = "LICENSE"}
authors = [
  {name = "Adeliya Leleytner"},
  {name = "Maxim Fedorov"},
]
dependencies = [
  "numpy==1.26.4",
  "pandas==2.3.1",
  "scipy==1.13.1",
  "threadpoolctl==3.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
